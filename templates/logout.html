<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora AI — Signed Out</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#FFF8F2;                 /* warm paper */
  --bg-2:#FBEFEA;
  --surface:#FFFFFF;
  --line:rgba(45,42,110,.10);
  --line-2:rgba(45,42,110,.18);
  --ink:#241F3D;                /* deep indigo-ink, from the circuitry */
  --ink-2:#4B4570;
  --ink-3:#857FA0;

  --lavender:#9B7BF0;
  --magenta:#E84F9B;
  --coral:#FF5A4E;
  --amber:#FFA73B;

  --grad: linear-gradient(100deg, var(--lavender) 0%, var(--magenta) 38%, var(--coral) 68%, var(--amber) 100%);
  --grad-soft: linear-gradient(135deg, rgba(155,123,240,.14), rgba(232,79,155,.14) 45%, rgba(255,90,78,.14) 75%, rgba(255,167,59,.14));
  --glow: rgba(232,79,155,.28);
  --glow-soft: rgba(232,79,155,.12);

  --ff-display:'Sora',sans-serif;
  --ff-body:'DM Sans',sans-serif;
  --r-sm:14px;--r-md:20px;--r-lg:28px;--r-xl:40px;
  --ease:cubic-bezier(.22,.8,.26,.99);
}
body{
  font-family:var(--ff-body);background:var(--bg);color:var(--ink);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;-webkit-font-smoothing:antialiased;padding:20px;
}
::selection{background:rgba(232,79,155,.22);color:var(--ink)}
body::after{
  content:'';position:fixed;inset:0;z-index:2;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
  opacity:.5;
}
.nebula{position:fixed;border-radius:50%;filter:blur(120px);z-index:0;pointer-events:none;animation:nebDrift 26s ease-in-out infinite alternate}
.neb-1{width:760px;height:760px;background:radial-gradient(circle,rgba(155,123,240,.30) 0%,transparent 70%);top:-260px;left:-220px}
.neb-2{width:640px;height:640px;background:radial-gradient(circle,rgba(255,90,78,.22) 0%,transparent 70%);top:30%;right:-260px;animation-delay:7s}
.neb-3{width:600px;height:600px;background:radial-gradient(circle,rgba(255,167,59,.22) 0%,transparent 70%);bottom:-240px;left:30%;animation-delay:13s}
@keyframes nebDrift{0%{transform:translate(0,0) scale(1)}45%{transform:translate(60px,-50px) scale(1.08)}100%{transform:translate(-50px,50px) scale(.95)}}

/* navbar */
.navbar{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);
  width:min(1240px,calc(100% - 28px));height:64px;z-index:500;
  display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 14px;
  border-radius:999px;border:1px solid var(--line);
  background:rgba(255,248,242,.78);
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  box-shadow:0 14px 40px rgba(45,42,110,.06),inset 0 1px 0 rgba(255,255,255,.7);
}
.nav-brand{display:flex;align-items:center;text-decoration:none}
.logo-wrapper{
  display:flex;align-items:center;justify-content:center;
  background:var(--ink);padding:8px 20px;border-radius:999px;
  box-shadow:0 4px 12px rgba(36,31,61,.12);
  transition:all .3s var(--ease);
}
.logo-wrapper:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 18px rgba(36,31,61,.2);
}
.logo-wrapper img{
  width:130px;height:auto;display:block;
}

/* card */
.card-wrapper{position:relative;z-index:10;width:100%;max-width:440px;animation:cardIn .9s var(--ease) both}
@keyframes cardIn{from{opacity:0;transform:translateY(38px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.logout-card{
  position:relative;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);
  padding:54px 42px 44px;text-align:center;
  box-shadow:0 30px 80px rgba(36,31,61,.08),0 10px 30px rgba(45,42,110,.03);
  overflow:hidden;
}
.logout-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--grad);background-size:220% auto;animation:gradFlow 4s linear infinite;
}
@keyframes gradFlow{0%{background-position:0% center}100%{background-position:220% center}}

/* check ring + ripples */
.check-stage{position:relative;width:92px;height:92px;margin:0 auto 30px}
.ripple{position:absolute;top:50%;left:50%;border-radius:50%;border:1px solid rgba(76,175,128,.15);transform:translate(-50%,-50%);animation:rippleOut 3s ease-out infinite}
.ripple-2{animation-delay:1s}.ripple-3{animation-delay:2s}
@keyframes rippleOut{0%{width:92px;height:92px;opacity:.8}100%{width:200px;height:200px;opacity:0}}
.check-ring{
  width:92px;height:92px;border-radius:50%;
  background:rgba(76,175,128,.05);
  border:1px solid rgba(76,175,128,.3);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px rgba(76,175,128,.08),inset 0 1px 0 rgba(255,255,255,.7);
  animation:popIn .6s .15s var(--ease) both,ringFloat 5s ease-in-out 1s infinite;
  position:relative;z-index:1;
}
@keyframes popIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes ringFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.check-ring svg{width:36px;height:36px}
.check-ring svg path{stroke:#2C8A5E;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;fill:none;stroke-dasharray:38;stroke-dashoffset:38;animation:drawCheck .5s .6s ease forwards;filter:drop-shadow(0 1px 2px rgba(44,138,94,.15))}
@keyframes drawCheck{to{stroke-dashoffset:0}}

/* brand */
.card-brand{display:flex;flex-direction:column;align-items:center;margin-bottom:20px;animation:riseIn .6s .35s var(--ease) both;position:relative;z-index:1}
.card-slogan{font-family:var(--ff-body);font-size:11.5px;color:var(--ink-3);letter-spacing:.3px}
@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* status chip */
.status-chip{
  display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line-2);
  font-family:var(--ff-display);font-size:12.5px;font-weight:600;color:var(--ink-2);
  margin-bottom:22px;box-shadow:0 6px 18px rgba(45,42,110,.05);
  animation:riseIn .6s .5s var(--ease) both;
}
.status-dot{width:7px;height:7px;border-radius:50%;background:#2C8A5E;box-shadow:0 0 8px rgba(44, 138, 94, 0.4);animation:pulse 2.2s ease infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}

.logout-heading{
  font-family:var(--ff-display);font-size:24px;font-weight:800;letter-spacing:-.02em;margin-bottom:12px;
  color:var(--ink);
  animation:riseIn .6s .62s var(--ease) both;
}
.logout-sub{font-size:14.5px;line-height:1.7;color:var(--ink-2);max-width:320px;margin:0 auto 28px;animation:riseIn .6s .72s var(--ease) both}

.divider{width:44px;height:1px;background:var(--line-2);margin:0 auto 28px;animation:riseIn .6s .8s var(--ease) both}

/* CTA */
.signin-btn{
  display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 34px;
  background:var(--grad);background-size:220% 220%;color:#fff;border:none;border-radius:14px;
  font-family:var(--ff-display);font-size:15px;font-weight:700;text-decoration:none;letter-spacing:-.1px;
  transition:all .35s var(--ease);box-shadow:0 12px 28px var(--glow-soft);
  position:relative;overflow:hidden;cursor:pointer;
  animation:riseIn .6s .9s var(--ease) both;
}
.signin-btn::after{
  content:'';position:absolute;top:0;left:-80%;width:60%;height:100%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.28),transparent);
  transform:skewX(-20deg);transition:left .6s var(--ease);
}
.signin-btn:hover::after{left:120%}
.signin-btn:hover{transform:translateY(-2px);box-shadow:0 16px 36px var(--glow);filter:brightness(1.04)}
.signin-btn i{transition:transform .3s var(--ease)}
.signin-btn:hover i{transform:translateX(4px)}

.trust-row{display:flex;justify-content:center;gap:18px;margin-top:24px;flex-wrap:wrap;animation:riseIn .6s 1s var(--ease) both;padding-top:18px;border-top:1px solid var(--line)}
.trust-badge{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);font-weight:500}
.trust-badge i{color:var(--magenta);font-size:11px}

.secure-note{margin-top:18px;font-family:var(--ff-body);font-size:11.5px;color:var(--ink-3);letter-spacing:.3px;animation:riseIn .6s 1.1s var(--ease) both}

@media(max-width:520px){
  .logout-card{padding:42px 26px 34px;border-radius:28px}
  .nav-logo{width:110px}
  .card-logo{width:126px}
}
</style>
</head>
<body>

<div class="nebula neb-1"></div>
<div class="nebula neb-2"></div>
<div class="nebula neb-3"></div>



<div class="card-wrapper">
  <div class="logout-card">

    <div class="check-stage">
      <div class="ripple"></div>
      <div class="ripple ripple-2"></div>
      <div class="ripple ripple-3"></div>
      <div class="check-ring">
        <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 19L15 26.5L29 10"/>
        </svg>
      </div>
    </div>

    <div class="card-brand">
      <div class="logo-wrapper" style="margin-bottom:12px; display:inline-flex; width:max-content; padding:8px 20px;">
        <img src="{{ url_for('static', filename='images/logo_nexora_full.png') }}" alt="Nexora AI" style="width: 140px; height: auto;">
      </div>
      <span class="card-slogan">Neural Knowledge Intelligence</span>
    </div>

    <div class="status-chip">
      <span class="status-dot"></span>
      Session cleared successfully
    </div>

    <h2 class="logout-heading">You're signed out</h2>

    <p class="logout-sub">You've been securely signed out of your Nexora workspace. All session data has been cleared.</p>

    <div class="divider"></div>

    <a class="signin-btn" href="/login">
      Sign back in
      <i class="fa-solid fa-arrow-right"></i>
    </a>

    <div class="trust-row">
      <span class="trust-badge"><i class="fa-solid fa-key"></i>Encrypted</span>
      <span class="trust-badge"><i class="fa-solid fa-user-shield"></i>Private</span>
      <span class="trust-badge"><i class="fa-solid fa-bolt"></i>Instant</span>
    </div>

    <p class="secure-note">All local session tokens have been revoked.</p>

  </div>
</div>

<!-- No additional scripts needed for static logout view -->
</body>
</html>

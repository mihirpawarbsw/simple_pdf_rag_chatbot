<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora AI — Signed Out</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous">

<!-- Three.js Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  /* Color Palette */
  --surface-abyss: #012624;         /* Page canvas, primary background */
  --surface-trench: #011d1c;        /* Card surface, pressed depth */
  --surface-reef: #003734;          /* Interactive card background, reef */
  --color-fog-veil: #bbc7c6;         /* Secondary copy, muted typography */
  --color-ice-mist: #edfffe;         /* Accent strokes, highlight borders */
  --color-ash-gray: #333333;         /* Dark structural borders */
  --color-snow-sheet: #ffffff;       /* Primary headlines, white typography */
  --color-lilac-wisp: #fde9ff;       /* Compliment border tint, lavender */
  --color-current-gradient: #00E6CB; /* Glow accent base */
  
  /* Aurora Wash Gradients */
  --grad-card: linear-gradient(135deg, rgba(0,130,124,0.25), rgba(203,255,252,0.18), rgba(253,233,255,0.15));
  --grad-btn: linear-gradient(90deg, #00827C 0%, #00A896 25%, #00E6CB 55%, #CBFFFC 100%);
  --grad-heading: linear-gradient(90deg, #CBFFFC 0%, #EDFFFE 35%, #FFFFFF 55%, #FDE9FF 100%);
  --grad-hover: linear-gradient(135deg, #003734 0%, #00827C 25%, #00E6CB 50%, #CBFFFC 75%, #FDE9FF 100%);
  --grad-btn-hover: linear-gradient(90deg, #00A896 0%, #00E6CB 35%, #CBFFFC 70%, #FDE9FF 100%);
  
  --grad-current: var(--grad-btn);
  --grad-aurora: var(--grad-heading);

  --ff-display: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --ff-body: 'DM Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;

  --radius-tags: 6px;
  --radius-cards: 16px;
  --radius-inputs: 6px;
  --radius-avatars: 9999px;
  --radius-buttons: 6px;
  
  --ease: cubic-bezier(.22,.8,.26,.99);
}

body{
  font-family:var(--ff-body);
  background: linear-gradient(180deg, #012624 0%, #003734 100%);
  background-attachment: fixed;
  color:var(--color-fog-veil);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  overflow-y:auto;overflow-x:hidden;position:relative;-webkit-font-smoothing:antialiased;padding:40px 20px;
}
::selection{background:rgba(203,255,252,.2);color:var(--color-snow-sheet)}

/* Grid Backdrop in Luminous Teal */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background-image: 
    linear-gradient(to right, rgba(203, 255, 252, 0.012) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(203, 255, 252, 0.012) 1px, transparent 1px);
  background-size: 60px 60px;
}

/* Subtle Film Grain */
body::after{
  content:'';position:fixed;inset:0;z-index:2;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.02'/%3E%3C/svg%3E");
  opacity:.3;
}

#canvas-container {
  position:fixed;inset:0;z-index:1;pointer-events:none;
}

/* Atmospheric section backgrounds (Bioluminescent drift spots) */
.nebula{position:fixed;border-radius:50%;filter:blur(140px);z-index:0;pointer-events:none;animation:nebDrift 30s ease-in-out infinite alternate}
.neb-1{width:760px;height:760px;background:radial-gradient(circle,rgba(0,130,124,.12) 0%,transparent 70%);top:-200px;left:-200px}
.neb-2{width:640px;height:640px;background:radial-gradient(circle,rgba(203,255,252,.08) 0%,transparent 70%);top:30%;right:-200px;animation-delay:7s}
.neb-3{width:600px;height:600px;background:radial-gradient(circle,rgba(253,233,255,.06) 0%,transparent 70%);bottom:-200px;left:30%;animation-delay:13s}
@keyframes nebDrift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,-30px) scale(1.03)}100%{transform:translate(-30px,50px) scale(0.97)}}

/* card */
.card-wrapper{position:relative;z-index:10;width:100%;max-width:440px;animation:cardIn .9s var(--ease) both}
@keyframes cardIn{from{opacity:0;transform:translateY(38px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.logout-card{
  position:relative;
  background:var(--grad-card);
  border:1px solid rgba(237,255,254,0.12);
  border-radius:var(--radius-cards);
  padding:54px 42px 44px;text-align:center;
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.05);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  overflow:hidden;
}

/* check ring + ripples */
.check-stage{position:relative;width:64px;height:64px;margin:0 auto 24px}
.ripple{position:absolute;top:50%;left:50%;border-radius:50%;border:1px solid rgba(0, 230, 203, 0.15);transform:translate(-50%,-50%);animation:rippleOut 3s ease-out infinite}
.ripple-2{animation-delay:1s}.ripple-3{animation-delay:2s}
@keyframes rippleOut{0%{width:64px;height:64px;opacity:.8}100%{width:140px;height:140px;opacity:0}}
.check-ring{
  width:64px;height:64px;border-radius:50%;
  background:rgba(0, 230, 203, 0.05);
  border:1px solid rgba(0, 230, 203, 0.3);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(0, 230, 203, 0.08),inset 0 1px 0 rgba(255,255,255,0.05);
  animation:popIn .6s .15s var(--ease) both,ringFloat 5s ease-in-out 1s infinite;
  position:relative;z-index:1;
}
@keyframes popIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes ringFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.check-ring svg{width:24px;height:24px}
.check-ring svg path{stroke:#00E6CB;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;fill:none;stroke-dasharray:38;stroke-dashoffset:38;animation:drawCheck .5s .6s ease forwards;filter:drop-shadow(0 0 8px rgba(0, 230, 203, 0.3))}
@keyframes drawCheck{to{stroke-dashoffset:0}}

/* brand */
.card-brand{display:flex;flex-direction:column;align-items:center;margin-bottom:28px;animation:riseIn .6s .35s var(--ease) both;position:relative;z-index:1}
.logo-wrapper{
  display:flex;align-items:center;justify-content:center;
  background:#ffffff !important;padding:6px 18px;border-radius:12px;
  box-shadow: inset 1px 1px 2px rgba(255, 255, 255, 0.9), inset -2px -2px 4px rgba(0, 0, 0, 0.15), 4px 4px 10px rgba(0, 0, 0, 0.25);
  border:1px solid rgba(0, 0, 0, 0.05);
  transition:all .3s var(--ease);
}
.logo-wrapper:hover{
  transform:translateY(-2px);
  box-shadow: inset 1px 1px 2px rgba(255, 255, 255, 0.9), inset -2px -2px 4px rgba(0, 0, 0, 0.15), 6px 6px 16px rgba(0, 0, 0, 0.3);
}
.logo-wrapper img{width:116px;height:auto;display:block}
.card-slogan{display:block;font-family:var(--ff-body);font-size:12px;font-weight:500;text-transform: uppercase;color:var(--color-current-gradient);letter-spacing:1px;text-align:center}
@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* status chip */
.status-chip{
  display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:999px;
  background:rgba(1, 38, 36, 0.45);border:1px solid rgba(237,255,254,0.1);
  font-family:var(--ff-display);font-size:11.5px;font-weight:500;color:var(--color-fog-veil);
  margin-bottom:22px;box-shadow:none;
  animation:riseIn .6s .5s var(--ease) both;
}
.status-dot{width:7px;height:7px;border-radius:50%;background:#00E6CB;box-shadow:0 0 8px rgba(0, 230, 203, 0.6);animation:pulse 2.2s ease infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}

.logout-heading{
  font-family:var(--ff-display);font-size:24px;font-weight:400;letter-spacing:-.02em;margin-bottom:12px;
  color:var(--color-snow-sheet);
  animation:riseIn .6s .62s var(--ease) both;
}
.logout-sub{font-size:14px;line-height:1.6;color:var(--color-fog-veil);max-width:320px;margin:0 auto 28px;animation:riseIn .6s .72s var(--ease) both}

.divider{width:44px;height:1px;background:rgba(237,255,254,0.1);margin:0 auto 28px;animation:riseIn .6s .8s var(--ease) both}

/* CTA */
.signin-btn{
  display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 34px;
  background:var(--grad-current);color:var(--surface-trench);border:none;border-radius:var(--radius-buttons);
  font-family:var(--ff-display);font-size:11px;font-weight:500;text-transform:uppercase;text-decoration:none;letter-spacing:1.44px;
  transition:all .3s var(--ease);box-shadow:0 8px 20px rgba(0, 130, 124, 0.2);
  position:relative;overflow:hidden;cursor:pointer;
  animation:riseIn .6s .9s var(--ease) both;
}
.signin-btn:hover{
  background: var(--grad-btn-hover);
  transform:translateY(-2px);
  box-shadow: 0 8px 24px rgba(0, 230, 203, 0.45);
}
.signin-btn i{transition:transform .3s var(--ease)}
.signin-btn:hover i{transform:translateX(4px)}

.trust-row{display:flex;justify-content:center;gap:16px;margin-top:24px;flex-wrap:wrap;animation:riseIn .6s 1s var(--ease) both;padding-top:18px;border-top:1px solid rgba(237,255,254,0.06)}
.trust-badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:500;text-transform: uppercase;letter-spacing:1px;color:rgba(203,255,252,0.4)}
.trust-badge i{color:var(--color-current-gradient);font-size:10px}

.secure-note{margin-top:18px;font-family:var(--ff-body);font-size:11px;color:rgba(203,255,252,0.3);letter-spacing:.3px;animation:riseIn .6s 1.1s var(--ease) both}

@media(max-width:520px){
  .logout-card{padding:42px 26px 34px;border-radius:var(--radius-cards)}
}
</style>
</head>
<body class="dark-mode">

<div class="nebula neb-1"></div>
<div class="nebula neb-2"></div>
<div class="nebula neb-3"></div>
<div id="canvas-container"></div>

<div class="card-wrapper">
  <div class="logout-card">

    <div class="check-stage">
      <div class="ripple"></div>
      <div class="ripple ripple-2"></div>
      <div class="ripple ripple-3"></div>
      <div class="check-ring">
        <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 19L15 26.5L29 10"/>
        </svg>
      </div>
    </div>

    <div class="card-brand">
      <div class="logo-wrapper" style="margin-bottom:12px; display:inline-flex; width:max-content; padding:8px 20px;">
        <img src="{{ url_for('static', filename='images/logo_nexora_full.png') }}" alt="Nexora AI" style="width: 130px; height: auto;">
      </div>
      <span class="card-slogan">Neural Knowledge Intelligence</span>
    </div>

    <div class="status-chip">
      <span class="status-dot"></span>
      Session cleared successfully
    </div>

    <h2 class="logout-heading">You're signed out</h2>

    <p class="logout-sub">You've been securely signed out of your Nexora workspace. All session data has been cleared.</p>

    <div class="divider"></div>

    <a class="signin-btn" href="/login">
      Sign back in
      <i class="fa-solid fa-arrow-right"></i>
    </a>

    <div class="trust-row">
      <span class="trust-badge"><i class="fa-solid fa-key"></i>Encrypted</span>
      <span class="trust-badge"><i class="fa-solid fa-user-shield"></i>Private</span>
      <span class="trust-badge"><i class="fa-solid fa-bolt"></i>Instant</span>
    </div>

    <p class="secure-note">All local session tokens have been revoked.</p>

  </div>
</div>

<script>
/* Three.js Constellation Background Animation */
(function() {
  const container = document.getElementById('canvas-container');
  if (!container) return;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 1, 1000);
  camera.position.z = 270;

  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  const networkGroup = new THREE.Group();
  scene.add(networkGroup);

  const particleCount = 160;
  const positions = new Float32Array(particleCount * 3);
  const velocities = [];

  for (let i = 0; i < particleCount; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos((Math.random() * 2) - 1);
    const r = 80 + Math.random() * 25;
    
    positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = r * Math.cos(phi);
    
    velocities.push({
      x: (Math.random() - 0.5) * 0.08,
      y: (Math.random() - 0.5) * 0.08,
      z: (Math.random() - 0.5) * 0.08
    });
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  function createCircleTexture(color) {
    const canvas = document.createElement('canvas');
    canvas.width = 32;
    canvas.height = 32;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(16, 16, 2.5, 0, Math.PI * 2);
    ctx.fill();
    
    const grad = ctx.createRadialGradient(16, 16, 2.5, 16, 16, 16);
    grad.addColorStop(0, 'rgba(203, 255, 252, 0.4)');
    grad.addColorStop(0.5, 'rgba(0, 130, 124, 0.15)');
    grad.addColorStop(1, 'rgba(0, 130, 124, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(16, 16, 16, 0, Math.PI * 2);
    ctx.fill();
    return new THREE.CanvasTexture(canvas);
  }

  const material = new THREE.PointsMaterial({
    size: 13,
    transparent: true,
    opacity: 0.9,
    map: createCircleTexture('#cbfffc'),
    depthWrite: false
  });

  const points = new THREE.Points(geometry, material);
  networkGroup.add(points);

  const maxConnections = particleCount * 4;
  const linePositions = new Float32Array(maxConnections * 6);
  const lineGeometry = new THREE.BufferGeometry();
  lineGeometry.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));

  const lineMaterial = new THREE.LineBasicMaterial({
    color: 0x00827c,
    transparent: true,
    opacity: 0.22
  });

  const lines = new THREE.LineSegments(lineGeometry, lineMaterial);
  networkGroup.add(lines);

  let mouseX = 0, mouseY = 0;
  let targetX = 0, targetY = 0;

  window.addEventListener('mousemove', function(e) {
    targetX = (e.clientX - window.innerWidth / 2) * 0.08;
    targetY = (e.clientY - window.innerHeight / 2) * 0.08;
  });

  let autoRotationY = 0;
  let autoRotationX = 0;

  function animate() {
    requestAnimationFrame(animate);

    const pos = geometry.attributes.position.array;
    const linePos = lineGeometry.attributes.position.array;
    let lineIdx = 0;

    for (let i = 0; i < particleCount; i++) {
      pos[i * 3] += velocities[i].x;
      pos[i * 3 + 1] += velocities[i].y;
      pos[i * 3 + 2] += velocities[i].z;

      const dist = Math.sqrt(pos[i * 3]**2 + pos[i * 3 + 1]**2 + pos[i * 3 + 2]**2);
      if (dist > 110 || dist < 70) {
        velocities[i].x *= -1;
        velocities[i].y *= -1;
        velocities[i].z *= -1;
      }
    }
    geometry.attributes.position.needsUpdate = true;

    for (let i = 0; i < particleCount; i++) {
      const x1 = pos[i * 3];
      const y1 = pos[i * 3 + 1];
      const z1 = pos[i * 3 + 2];

      for (let j = i + 1; j < particleCount; j++) {
        const x2 = pos[j * 3];
        const y2 = pos[j * 3 + 1];
        const z2 = pos[j * 3 + 2];

        const dist = Math.sqrt((x2 - x1)**2 + (y2 - y1)**2 + (z2 - z1)**2);

        if (dist < 46 && lineIdx < maxConnections) {
          linePos[lineIdx * 6] = x1;
          linePos[lineIdx * 6 + 1] = y1;
          linePos[lineIdx * 6 + 2] = z1;
          linePos[lineIdx * 6 + 3] = x2;
          linePos[lineIdx * 6 + 4] = y2;
          linePos[lineIdx * 6 + 5] = z2;
          lineIdx++;
        }
      }
    }
    lineGeometry.setDrawRange(0, lineIdx * 2);
    lineGeometry.attributes.position.needsUpdate = true;

    mouseX += (targetX - mouseX) * 0.05;
    mouseY += (targetY - mouseY) * 0.05;

    autoRotationY += 0.001;
    autoRotationX += 0.0005;

    networkGroup.rotation.x = autoRotationX + (mouseY * 0.004);
    networkGroup.rotation.y = autoRotationY + (mouseX * 0.004);

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', function() {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });

  animate();
})();
</script>
</body>
</html>

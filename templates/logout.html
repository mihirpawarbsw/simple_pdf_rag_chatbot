<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Logged Out</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter',sans-serif;
        }

        body{

            height:100vh;

            display:flex;

            justify-content:center;
            align-items:center;

            background:#0b0c0f;

            color:white;
        }

        .card{

            background:#171a21;

            padding:40px;

            border-radius:22px;

            text-align:center;

            border:1px solid rgba(255,255,255,0.06);
        }

        h1{

            margin-bottom:16px;
        }

        a{

            display:inline-block;

            margin-top:20px;

            text-decoration:none;

            color:white;

            padding:12px 22px;

            border-radius:12px;

            background:linear-gradient(
                135deg,
                #7c8cff,
                #5b6dff
            );
        }

    </style>

</head>

<body>

    <div class="card">

        <h1>
            Logged Out
        </h1>

        <p>
            You have been logged out successfully.
        </p>

        <a href="/login">

            Login Again

        </a>

    </div>

</body>

</html>

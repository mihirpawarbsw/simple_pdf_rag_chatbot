<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora.AI — Create Account</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>

/* =============================================
   RESET + DESIGN SYSTEM TOKENS
   ============================================= */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg-base: #0c080f; /* Deep Sherbet warm-black base background */
  --bg-glass: rgba(255, 255, 255, 0.03);
  --border: rgba(255, 255, 255, 0.07);
  --border-hover: rgba(255, 255, 255, 0.14);
  --text-primary: #fff1f2; /* Rose-tinted white */
  --text-secondary: rgba(255, 241, 242, 0.65);
  --text-muted: rgba(255, 241, 242, 0.35);
  --font-display: 'Sora', sans-serif;
  --font-body: 'DM Sans', sans-serif;

  /* ── SHERBET PINK/AMBER ACCENTS ── */
  --accent: #f43f5e;
  --accent-light: #fcd34d;
  --accent-deep: #e11d48;
  --accent-glow: rgba(244, 63, 94, 0.35);
  --accent-glow-soft: rgba(244, 63, 94, 0.12);
  --accent-border: rgba(244, 63, 94, 0.25);
  --accent-border-hover: rgba(244, 63, 94, 0.55);
  --accent-text: #fba518;
  --accent-bg: rgba(244, 63, 94, 0.08);
}

body {
  font-family: var(--font-body);
  background: var(--bg-base);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

/* grain texture */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  opacity: 0.28; z-index: 1; pointer-events: none;
}

/* =============================================
   DYNAMIC AMBIENT MESH GRADIENTS
   ============================================= */
.mesh-gradient {
  position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none;
}
.blob {
  position: absolute; border-radius: 50%;
  filter: blur(140px); opacity: 0.16;
  animation: blobMove 18s infinite alternate ease-in-out;
}
.blob1 { width: 500px; height: 500px; background: rgba(244, 63, 94, 0.22); top:-150px; left:-100px; }
.blob2 { width: 420px; height: 420px; background: rgba(251, 140, 0, 0.15); bottom:-150px; right:-100px; animation-delay: 3s; }
.blob3 { width: 300px; height: 300px; background: rgba(253, 216, 53, 0.1); top:40%; left:45%; animation-delay: 6s; }

@keyframes blobMove {
  0%   { transform: translate(0,0) scale(1); }
  50%  { transform: translate(40px,-50px) scale(1.1); }
  100% { transform: translate(-20px,20px) scale(0.9); }
}

/* =============================================
   NAVBAR
   ============================================= */
.navbar {
  position: fixed; top: 0; left: 0; width: 100%; height: 72px;
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 56px;
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  background: rgba(12,8,15,0.65);
  z-index: 200;
}

.nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.nav-logo { width: 140px; height: auto; object-fit: contain; flex-shrink: 0; }

.nav-login {
  height: 42px; padding: 0 22px;
  background: var(--bg-glass); color: var(--text-primary);
  border: 1px solid var(--accent-border); border-radius: 12px;
  font-family: var(--font-display); font-size: 13.5px; font-weight: 600;
  text-decoration: none; display: inline-flex; align-items: center;
  transition: all 0.28s cubic-bezier(0.25, 0.8, 0.25, 1);
}
.nav-login:hover {
  border-color: var(--accent-border-hover);
  color: #fff;
  background: var(--accent-bg);
  transform: translateY(-1px);
  box-shadow: 0 8px 24px var(--accent-glow-soft);
}

/* =============================================
   PAGE CARD WRAPPER
   ============================================= */
.card-wrapper {
  position: relative; z-index: 10;
  width: 100%; max-width: 440px;
  padding: 24px;
  animation: slideUp 0.6s cubic-bezier(0.25, 0.8, 0.25, 1) both;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(28px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.register-card {
  position: relative;
  background: rgba(20, 12, 22, 0.75); /* Highly customized dark Sherbet glass */
  border: 1px solid var(--accent-border);
  border-radius: 28px;
  padding: 44px 40px 36px;
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  box-shadow: 0 40px 100px rgba(0,0,0,0.65), 0 0 60px var(--accent-glow-soft), inset 0 1px 0 rgba(255,255,255,0.07);
  overflow: hidden;
}

/* animated top border shimmer */
.register-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1.5px;
  background: linear-gradient(90deg, transparent, var(--accent) 30%, var(--accent-light) 70%, transparent);
  background-size: 200% auto;
  animation: shimmerFlow 4s linear infinite;
}

@keyframes shimmerFlow {
  0% { background-position: 0% 50%; }
  100% { background-position: 200% 50%; }
}

.card-brand {
  display: flex; flex-direction: column; align-items: center; margin-bottom: 28px;
}
.card-logo { width: 160px; height: auto; object-fit: contain; margin-bottom: 8px; }
.card-slogan {
  font-family: var(--font-body); font-size: 12px;
  color: var(--accent-text); letter-spacing: 0.3px; margin-top: 4px;
  font-weight: 500;
}

.card-heading {
  font-family: var(--font-display); font-size: 22px; font-weight: 700;
  text-align: center; letter-spacing: -0.5px;
  margin-bottom: 26px;
  background: linear-gradient(135deg, #ffffff 0%, var(--accent-light) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* =============================================
   ALERT / STATUS BARS
   ============================================= */
.alert {
  width: 100%; padding: 13px 16px; border-radius: 14px;
  margin-bottom: 18px; font-size: 13px; text-align: center;
}
.alert-error {
  background: rgba(244, 63, 94, 0.05); border: 1px solid var(--accent-border);
  color: #ffa4b2;
}
.alert-success {
  background: rgba(244, 63, 94, 0.06); border: 1px solid var(--accent-border-hover);
  color: rgba(200,255,220,0.9);
}

/* =============================================
   FORM INPUTS
   ============================================= */
.input-group { margin-bottom: 13px; }
.input-group input {
  width: 100%; height: 54px; padding: 0 18px;
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  border-radius: 16px; color: var(--text-primary);
  font-family: var(--font-body); font-size: 14px;
  outline: none; transition: all 0.25s ease;
}
.input-group input::placeholder { color: var(--text-muted); }
.input-group input:focus {
  background: var(--accent-bg);
  border-color: var(--accent-border-hover);
  box-shadow: 0 0 0 3px var(--accent-glow-soft), 0 0 15px rgba(244, 63, 94, 0.2);
}

/* =============================================
   CREATIVE INTERACTIVE CTA BUTTON
   ============================================= */
.submit-btn {
  width: 100%; height: 54px; border: none; border-radius: 16px;
  background: linear-gradient(135deg, #f43f5e 0%, #fb8c00 50%, #fcd34d 100%);
  color: #ffffff;
  font-family: var(--font-display); font-size: 15px; font-weight: 700;
  cursor: pointer; letter-spacing: -0.2px; margin-top: 8px;
  transition: all 0.28s cubic-bezier(0.25, 0.8, 0.25, 1);
  box-shadow: 0 8px 24px var(--accent-glow-soft);
  text-shadow: 0 1px 2px rgba(0,0,0,0.2);
}
.submit-btn:hover {
  transform: scale(1.02) translateY(-2px);
  box-shadow: 0 14px 36px var(--accent-glow);
}

.login-link {
  text-align: center; font-size: 13.5px; color: var(--text-secondary); margin-top: 20px;
}
.login-link a {
  color: var(--accent-light); text-decoration: none; font-weight: 600;
  border-bottom: 1px solid var(--accent-border); padding-bottom: 1px;
  transition: all 0.2s;
}
.login-link a:hover { border-color: var(--accent-border-hover); color: #fff; }

/* =============================================
   PASSWORD STRENGTH METER
   ============================================= */
.strength-bar {
  height: 4px; border-radius: 99px;
  background: rgba(255,255,255,0.06);
  margin-top: 8px; overflow: hidden;
  display: none;
}
.strength-fill {
  height: 100%; width: 0%; border-radius: 99px;
  transition: width 0.3s ease, background 0.3s ease;
}

/* =============================================
   RESPONSIVE LAYOUT
   ============================================= */
@media (max-width: 520px) {
  .navbar { padding: 0 20px; }
  .register-card { padding: 36px 24px 28px; }
  .card-wrapper { padding: 16px; }
  .nav-logo { width: 120px; }
  .card-logo { width: 140px; }
}

</style>
</head>
<body>

<div class="mesh-gradient">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
</div>

<nav class="navbar">
  <a class="nav-brand" href="/login">
    <img src="{{ url_for('static', filename='images/logo_nexora_full.png') }}" alt="Nexora.AI" class="nav-logo">
  </a>
  <a class="nav-login" href="/login">Sign In</a>
</nav>

<div class="card-wrapper">
  <div class="register-card">

    <div class="card-brand">
      <img src="{{ url_for('static', filename='images/logo_nexora_full.png') }}" alt="Nexora.AI" class="card-logo">
      <p class="card-slogan">Your AI Knowledge Workspace</p>
    </div>

    <h2 class="card-heading">Create your account</h2>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    {% if success %}
    <div class="alert alert-success">{{ success }}</div>
    {% endif %}

    <form method="POST">
      <div class="input-group">
        <input type="text" name="username" placeholder="Username" required autocomplete="username" id="usernameInput">
      </div>
      <div class="input-group">
        <input type="password" name="password" placeholder="Password" required autocomplete="new-password" id="passwordInput">
        <div class="strength-bar" id="strengthBar">
          <div class="strength-fill" id="strengthFill"></div>
        </div>
      </div>
      <button type="submit" class="submit-btn">Create Account</button>
    </form>

    <div class="login-link">
      Already have an account? <a href="/login">Sign in</a>
    </div>

  </div>
</div>

<script>
// password strength visualizer
const pwInput = document.getElementById('passwordInput');
const bar = document.getElementById('strengthBar');
const fill = document.getElementById('strengthFill');

pwInput.addEventListener('input', function() {
  const val = this.value;
  if (!val) { bar.style.display = 'none'; return; }
  bar.style.display = 'block';
  let score = 0;
  if (val.length >= 6) score++;
  if (val.length >= 10) score++;
  if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
  const pcts = ['20%','45%','72%','100%'];
  // Smoothly blend colors from rose pink to glowing gold/amber
  const cols = ['rgba(244,63,94,0.5)','rgba(251,140,0,0.75)','rgba(251,191,36,0.85)','rgba(253,216,53,0.95)'];
  fill.style.width = pcts[score - 1] || '10%';
  fill.style.background = cols[score - 1] || 'rgba(244,63,94,0.3)';
});
</script>

</body>
</html>

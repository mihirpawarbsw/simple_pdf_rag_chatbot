<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora.AI — Create Account</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg-base: #080808;
  --bg-glass: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.07);
  --border-hover: rgba(255,255,255,0.14);
  --text-primary: #f0f0f0;
  --text-secondary: rgba(240,240,240,0.54);
  --text-muted: rgba(240,240,240,0.30);
  --font-display: 'Sora', sans-serif;
  --font-body: 'DM Sans', sans-serif;

  /* ── LAVENDER ACCENTS ── */
  --lavender: #B18FCF;
  --lavender-light: #C9A8E0;
  --lavender-deep: #8B5FBF;
  --lavender-glow: rgba(177, 143, 207, 0.35);
  --lavender-glow-soft: rgba(177, 143, 207, 0.12);
  --lavender-border: rgba(177, 143, 207, 0.25);
  --lavender-border-hover: rgba(177, 143, 207, 0.45);
  --lavender-text: #D4B8E8;
  --lavender-bg: rgba(177, 143, 207, 0.06);
}

body {
  font-family: var(--font-body);
  background: var(--bg-base);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

/* grain */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  opacity: 0.32; z-index: 1; pointer-events: none;
}

/* ambient glows — lavender hint */
.ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.ambient::before {
  content: '';
  position: absolute; top: -20%; left: -10%; width: 60%; height: 70%;
  background: radial-gradient(ellipse, rgba(177,143,207,0.035) 0%, transparent 65%);
}
.ambient::after {
  content: '';
  position: absolute; bottom: -10%; right: -10%; width: 55%; height: 60%;
  background: radial-gradient(ellipse, rgba(177,143,207,0.022) 0%, transparent 65%);
}

/* navbar */
.navbar {
  position: fixed; top: 0; left: 0; width: 100%; height: 72px;
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 56px;
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(20px);
  background: rgba(8,8,8,0.65);
  z-index: 200;
}

.nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }

.brand-orb {
  width: 26px; height: 26px; border-radius: 50%;
  background: linear-gradient(135deg, #ffffff 0%, var(--lavender) 100%);
  box-shadow: 0 0 22px rgba(177,143,207,0.35), 0 0 7px rgba(177,143,207,0.5);
  animation: breathe 3s ease-in-out infinite; flex-shrink: 0;
}

@keyframes breathe {
  0%,100% { box-shadow: 0 0 22px rgba(177,143,207,0.32), 0 0 7px rgba(177,143,207,0.45); transform: scale(1); }
  50%      { box-shadow: 0 0 34px rgba(177,143,207,0.50), 0 0 12px rgba(177,143,207,0.6); transform: scale(1.05); }
}

.brand-name {
  font-family: var(--font-display); font-size: 20px; font-weight: 700;
  letter-spacing: -0.5px; color: var(--text-primary);
}

.nav-login {
  height: 42px; padding: 0 22px;
  background: var(--bg-glass); color: var(--lavender-text);
  border: 1px solid var(--lavender-border); border-radius: 12px;
  font-family: var(--font-display); font-size: 13.5px; font-weight: 500;
  text-decoration: none; display: flex; align-items: center;
  transition: all 0.25s ease;
}
.nav-login:hover {
  border-color: var(--lavender-border-hover);
  color: var(--lavender-light);
  background: var(--lavender-bg);
  box-shadow: 0 8px 24px rgba(177,143,207,0.12);
}

/* card wrapper */
.card-wrapper {
  position: relative; z-index: 10;
  width: 100%; max-width: 440px;
  padding: 24px;
  animation: slideUp 0.5s cubic-bezier(0.22,1,0.36,1) both;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(24px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.register-card {
  position: relative;
  background: rgba(11,11,11,0.96);
  border: 1px solid var(--lavender-border);
  border-radius: 28px;
  padding: 44px 40px 36px;
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  box-shadow: 0 40px 100px rgba(0,0,0,0.7), 0 0 60px rgba(177,143,207,0.06), inset 0 1px 0 rgba(255,255,255,0.07);
  overflow: hidden;
}

/* shimmer line — lavender */
.register-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(177,143,207,0.25) 40%, rgba(177,143,207,0.25) 60%, transparent);
}

.card-brand {
  display: flex; flex-direction: column; align-items: center; margin-bottom: 28px;
}
.card-orb-row {
  display: flex; align-items: center; gap: 10px; margin-bottom: 7px;
}
.card-orb {
  width: 18px; height: 18px; border-radius: 50%;
  background: linear-gradient(135deg, #ffffff 0%, var(--lavender) 100%);
  box-shadow: 0 0 16px rgba(177,143,207,0.4);
  animation: breathe 3s ease-in-out infinite;
}
.card-brand-name {
  font-family: var(--font-display); font-size: 20px; font-weight: 800; letter-spacing: -0.5px;
  color: var(--text-primary);
}
.card-tagline { font-size: 12px; color: var(--lavender-text); letter-spacing: 0.3px; }

.card-heading {
  font-family: var(--font-display); font-size: 22px; font-weight: 700;
  text-align: center; letter-spacing: -0.5px;
  margin-bottom: 26px;
  background: linear-gradient(135deg, #ffffff 0%, var(--lavender-light) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* alert */
.alert {
  width: 100%; padding: 13px 16px; border-radius: 14px;
  margin-bottom: 18px; font-size: 13px; text-align: center;
}
.alert-error {
  background: rgba(177,143,207,0.05); border: 1px solid var(--lavender-border);
  color: rgba(212,184,232,0.9);
}
.alert-success {
  background: rgba(177,143,207,0.06); border: 1px solid var(--lavender-border-hover);
  color: rgba(200,255,220,0.9);
}

/* inputs */
.input-group { margin-bottom: 13px; }
.input-group input {
  width: 100%; height: 54px; padding: 0 18px;
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  border-radius: 16px; color: var(--text-primary);
  font-family: var(--font-body); font-size: 14px;
  outline: none; transition: all 0.22s ease;
}
.input-group input::placeholder { color: var(--text-muted); }
.input-group input:focus {
  background: rgba(177,143,207,0.05);
  border-color: var(--lavender-border-hover);
  box-shadow: 0 0 0 3px rgba(177,143,207,0.08);
}

/* button */
.submit-btn {
  width: 100%; height: 54px; border: none; border-radius: 16px;
  background: linear-gradient(135deg, #ffffff 0%, var(--lavender-light) 100%);
  color: #080808;
  font-family: var(--font-display); font-size: 15px; font-weight: 700;
  cursor: pointer; letter-spacing: -0.2px; margin-top: 8px;
  transition: all 0.25s ease;
}
.submit-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 36px rgba(177,143,207,0.35);
}

.login-link {
  text-align: center; font-size: 13.5px; color: var(--text-secondary); margin-top: 20px;
}
.login-link a {
  color: var(--lavender-light); text-decoration: none; font-weight: 600;
  border-bottom: 1px solid var(--lavender-border); padding-bottom: 1px;
  transition: border-color 0.2s;
}
.login-link a:hover { border-color: var(--lavender-border-hover); }

/* password strength indicator */
.strength-bar {
  height: 3px; border-radius: 99px;
  background: rgba(255,255,255,0.06);
  margin-top: 8px; overflow: hidden;
  display: none;
}
.strength-fill {
  height: 100%; width: 0%; border-radius: 99px;
  transition: width 0.3s ease, background 0.3s ease;
}

@media (max-width: 520px) {
  .navbar { padding: 0 20px; }
  .register-card { padding: 36px 24px 28px; }
  .card-wrapper { padding: 16px; }
}

</style>
</head>
<body>

<div class="ambient"></div>

<nav class="navbar">
  <a class="nav-brand" href="/login">
    <div class="brand-orb"></div>
    <span class="brand-name">Nexora.AI</span>
  </a>
  <a class="nav-login" href="/login">Sign In</a>
</nav>

<div class="card-wrapper">
  <div class="register-card">

    <div class="card-brand">
      <div class="card-orb-row">
        <div class="card-orb"></div>
        <span class="card-brand-name">Nexora AI</span>
      </div>
      <p class="card-tagline">Your AI Knowledge Workspace</p>
    </div>

    <h2 class="card-heading">Create your account</h2>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    {% if success %}
    <div class="alert alert-success">{{ success }}</div>
    {% endif %}

    <form method="POST">
      <div class="input-group">
        <input type="text" name="username" placeholder="Username" required autocomplete="username" id="usernameInput">
      </div>
      <div class="input-group">
        <input type="password" name="password" placeholder="Password" required autocomplete="new-password" id="passwordInput">
        <div class="strength-bar" id="strengthBar">
          <div class="strength-fill" id="strengthFill"></div>
        </div>
      </div>
      <button type="submit" class="submit-btn">Create Account</button>
    </form>

    <div class="login-link">
      Already have an account? <a href="/login">Sign in</a>
    </div>

  </div>
</div>

<script>
// password strength visual
const pwInput = document.getElementById('passwordInput');
const bar = document.getElementById('strengthBar');
const fill = document.getElementById('strengthFill');

pwInput.addEventListener('input', function() {
  const val = this.value;
  if (!val) { bar.style.display = 'none'; return; }
  bar.style.display = 'block';
  let score = 0;
  if (val.length >= 6) score++;
  if (val.length >= 10) score++;
  if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
  const pcts = ['20%','45%','72%','100%'];
  const cols = ['rgba(177,143,207,0.5)','rgba(177,143,207,0.7)','rgba(201,168,224,0.85)','rgba(212,184,232,0.95)'];
  fill.style.width = pcts[score - 1] || '10%';
  fill.style.background = cols[score - 1] || 'rgba(177,143,207,0.3)';
});
</script>

</body>
</html>
